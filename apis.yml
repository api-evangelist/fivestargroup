name: Fivestargroup
description: 'Five Star Group (Five Star Business Finance) is an India-based non-banking
  financial company (NBFC) that provides small-business and mortgage loans to self-employed
  and underserved borrowers, primarily across southern India. Its public web presence
  is an investor-relations and customer-service portal covering board and management
  disclosures, financials, annual reports, NCD and SEBI (LODR) compliances, RBI policies,
  credit ratings, and investor grievance redressal, alongside customer tools such as
  a loan mobile app, online EMI payments, and NACH mandate cancellation. It is listed
  in the API Evangelist network as a portfolio company of Norwest Venture Partners.
  No public developer program, API, or SDK was found during enrichment.'
